name: Build C-Forge native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir y probar en Unix
        if: runner.os != 'Windows'
        run: |
          make clean
          make build
          make release-check
      - name: Construir y probar en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /std:c++20 /EHsc /O2 /Fe:cforge.exe cforgev.cpp ws2_32.lib
          $env:CFORGE_STDLIB = "$PWD\stdlib"
          .\cforge.exe --version
          Get-ChildItem stdlib\*.cfv | ForEach-Object { & .\cforge.exe check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tests\cfv\*.cfv | ForEach-Object { & .\cforge.exe test $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
