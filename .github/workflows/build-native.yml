name: Build C-Forge native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir y probar en Unix
        if: runner.os != 'Windows'
        run: |
          make clean
          make build
          make check
          make test
          make backend-check
          make install-check
      - name: Construir y probar en Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /std:c++20 /EHsc /O2 /Fe:cforge.exe cforgev.cpp ws2_32.lib
          cforge.exe --version
          cforge.exe test tests\cfv\01_nucleo.cfv
          cforge.exe test tests\cfv\02_funciones.cfv
