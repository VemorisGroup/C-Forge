name: Build cforgev native binary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            binary: cforgev
          - os: ubuntu-latest
            platform: linux-x64
            binary: cforgev
          - os: windows-latest
            platform: windows-x64
            binary: cforgev.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (solo para compilar — no va en el binario)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang++ (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang

      - name: Add clang++ to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows runners traen LLVM preinstalado en C:/Program Files/LLVM/bin
          echo "C:/Program Files/LLVM/bin" >> $GITHUB_PATH
          clang++ --version || echo "clang++ no encontrado en ruta default"

      - name: Compile cforgev.cfv → native binary
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python3 -c "
          from pathlib import Path
          from compilador_nativo import compile_native
          binary = '${{ matrix.binary }}'
          print('Compilando cforgev.cfv ->', binary)
          result = compile_native(Path('cforgev.cfv'), Path(binary))
          print('OK:', result)
          "

      - name: Smoke test
        shell: bash
        run: |
          echo 'mostrar("C-Forge native OK en ${{ matrix.platform }}")' > smoke.cfv
          ./${{ matrix.binary }} smoke.cfv

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cforgev-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # Adjuntar binarios al release de GitHub cuando se crea un tag vX.Y.Z
  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename binaries with platform suffix
        run: |
          mkdir release-bins
          mv artifacts/cforgev-macos-arm64/cforgev    release-bins/cforgev-macos-arm64
          mv artifacts/cforgev-linux-x64/cforgev      release-bins/cforgev-linux-x64
          mv artifacts/cforgev-windows-x64/cforgev.exe release-bins/cforgev-windows-x64.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" release-bins/* \
            --repo "${{ github.repository }}"
