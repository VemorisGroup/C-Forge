name: Seguridad continua

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
      - name: Build para CodeQL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y clang
          clang++ -std=c++20 -O0 -Iinclude cforgev.cpp -o cforge_codeql
      - uses: github/codeql-action/analyze@v3

  fuzz-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang++ (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang

      - name: Compilar motor nativo
        run: |
          make clean
          make build CXX=clang++

      - name: Fuzz smoke — entradas inválidas no crashean
        shell: bash
        run: |
          for prog in \
            'mostrar("hola")' \
            'sea x: numero = 1 + 2  mostrar(x)' \
            'si (verdadero) { mostrar("ok") }' \
            'funcion f(n: numero): numero { retornar n * 2 }  mostrar(f(5))' \
            '}{invalid{{}' \
            '@@@@' \
            '' ; do
            echo "$prog" > /tmp/fuzz_case.cfv
            ./cforge /tmp/fuzz_case.cfv 2>/dev/null || true
          done
          echo 'mostrar("fuzz OK")' > /tmp/fuzz_valid.cfv
          ./cforge /tmp/fuzz_valid.cfv
