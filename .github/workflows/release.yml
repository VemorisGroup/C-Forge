name: Publicar C-Forge nativo

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: cforge-macos-native
          - os: ubuntu-latest
            artifact: cforge-linux-x64
          - os: windows-latest
            artifact: cforge-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Construir en Unix
        if: runner.os != 'Windows'
        run: |
          make clean
          make build
          make release-check
          cp cforge "${{ matrix.artifact }}"

      - name: Construir en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /std:c++20 /EHsc /O2 /Fe:cforge.exe cforgev.cpp ws2_32.lib
          $env:CFORGE_STDLIB = "$PWD\stdlib"
          .\cforge.exe --version
          Get-ChildItem tests\cfv\*.cfv | ForEach-Object { & .\cforge.exe test $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Copy-Item cforge.exe "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir paquete Debian nativo
        run: packaging/debian/build-deb.sh "${GITHUB_REF_NAME#v}" amd64
      - uses: actions/upload-artifact@v4
        with:
          name: cforge-debian
          path: dist/*.deb

  release:
    needs: [native, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generar sumas SHA-256
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publicar artefactos verificados
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "C-Forge $GITHUB_REF_NAME"
