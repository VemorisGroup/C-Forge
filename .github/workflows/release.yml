name: C-Forge Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# JOB 0 — Validar que tag == VERSION del Makefile y del binario
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate-version:
    name: Validar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extraer versión del tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias mínimas
        run: sudo apt-get update -qq && sudo apt-get install -y g++

      - name: Compilar cforge para verificar versión en binario
        run: g++ -std=c++20 -O0 -I./include -o cforge cforgev.cpp -lpthread -ldl

      - name: Verificar versión en Makefile, binario y cforgev.cpp
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MF=$(grep '^VERSION' Makefile | head -1 | sed 's/VERSION[[:space:]]*:=[[:space:]]*//')
          BIN=$(./cforge --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CPP=$(grep 'return "' cforgev.cpp | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Tag:         $TAG"
          echo "Makefile:    $MF"
          echo "Binario:     $BIN"
          echo "cforgev.cpp: $CPP"
          FAIL=0
          [ "$TAG" != "$MF"  ] && echo "ERROR: tag != Makefile"   && FAIL=1
          [ "$TAG" != "$BIN" ] && echo "ERROR: tag != binario"    && FAIL=1
          [ "$TAG" != "$CPP" ] && echo "ERROR: tag != cforgev.cpp" && FAIL=1
          [ $FAIL -eq 1 ] && exit 1
          echo "OK — versión $TAG consistente"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build Linux x64 + gate + .tar.gz + .deb
# ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux x64
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev libsqlite3-dev dpkg-dev

      - name: Build
        run: make build

      - name: check (sintaxis)
        run: make check

      - name: test (pruebas unitarias)
        run: make test

      - name: stdlib-load-check
        run: make stdlib-load-check

      - name: cli-check
        run: make cli-check

      - name: malformed-check
        run: make malformed-check

      - name: backend-check
        run: make backend-check

      - name: install-check
        run: make install-check

      - name: bootstrap-check
        run: make bootstrap-check

      - name: backend-core-check
        run: |
          set -e
          make backend-core-bundle
          CXX=${CXX:-g++}
          dir=$(mktemp -d /tmp/cforge-bcc.XXXXXX)

          echo "=== [1/5] Compilando stage0 ($(uname -m)) ==="
          $CXX -std=c++20 -O2 -Wall -Wextra -Wpedantic \
            bootstrap/stage0/cforge_bootstrap.cpp -o "$dir/stage0"
          echo "stage0 OK"

          echo "=== [2/5] Compilando macho-core ==="
          "$dir/stage0" bootstrap/direct/cforge_macho_arm64_core.cfv \
            -o "$dir/macho-core"
          echo "macho-core OK: $(file $dir/macho-core | cut -c1-80)"

          echo "=== [3/5] Compilando pe-core ==="
          "$dir/stage0" bootstrap/direct/cforge_pe_x64_core.cfv \
            -o "$dir/pe-core"
          echo "pe-core OK: $(file $dir/pe-core | cut -c1-80)"

          echo "=== [4/5] Compilando elf-core ==="
          "$dir/stage0" bootstrap/direct/cforge_elf_x64_core.cfv \
            -o "$dir/elf-core"
          echo "elf-core OK: $(file $dir/elf-core | cut -c1-80)"

          echo "=== [5/5] Ejecutando fixtures con make backend-core-check ==="
          make backend-core-check

      - name: ir-core-check
        run: make ir-core-check

      - name: object-lowering-check
        run: make object-lowering-check

      - name: sanitize-check
        run: make sanitize-check

      - name: smoke-test
        run: make smoke-test

      - name: Empaquetar tar.gz
        run: |
          mkdir -p pkg/cforge-${VERSION}-linux-x64
          cp cforge pkg/cforge-${VERSION}-linux-x64/
          cp -r stdlib pkg/cforge-${VERSION}-linux-x64/
          cp install.sh README.md pkg/cforge-${VERSION}-linux-x64/
          cd pkg
          tar czf cforge-${VERSION}-linux-x64.tar.gz cforge-${VERSION}-linux-x64/

      - name: Empaquetar .deb
        run: packaging/debian/build-deb.sh "${VERSION}" amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            pkg/cforge-${{ env.VERSION }}-linux-x64.tar.gz
            dist/cforge_${{ env.VERSION }}_amd64.deb
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Build macOS ARM64 + gate + .tar.gz
# ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS ARM64
    needs: validate-version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: brew install openssl sqlite

      - name: Gate completo (release-check)
        run: make release-check CXX=clang++

      - name: Empaquetar tar.gz
        run: |
          mkdir -p pkg/cforge-${VERSION}-macos-arm64
          cp cforge pkg/cforge-${VERSION}-macos-arm64/
          cp -r stdlib pkg/cforge-${VERSION}-macos-arm64/
          cp install.sh README.md pkg/cforge-${VERSION}-macos-arm64/
          cd pkg
          tar czf cforge-${VERSION}-macos-arm64.tar.gz cforge-${VERSION}-macos-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: pkg/cforge-${{ env.VERSION }}-macos-arm64.tar.gz
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build Windows x64 + tests + .zip
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows x64
    needs: validate-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compilar con MSVC
        shell: cmd
        run: |
          rem Buscar vcvarsall.bat en rutas conocidas de VS 2022 (Enterprise, Professional, Community, BuildTools)
          set "VCVARSALL="
          for %%e in (Enterprise Professional Community BuildTools) do (
            if exist "C:\Program Files\Microsoft Visual Studio\2022\%%e\VC\Auxiliary\Build\vcvarsall.bat" (
              set "VCVARSALL=C:\Program Files\Microsoft Visual Studio\2022\%%e\VC\Auxiliary\Build\vcvarsall.bat"
            )
          )
          if "%VCVARSALL%"=="" (
            echo ERROR: vcvarsall.bat no encontrado en ninguna edicion de VS 2022
            dir "C:\Program Files\Microsoft Visual Studio\" 2>nul
            exit /b 1
          )
          echo Usando: %VCVARSALL%
          call "%VCVARSALL%" x64
          if errorlevel 1 (echo ERROR: vcvarsall.bat fallo && exit /b 1)
          where cl
          echo VSCMD_ARG_TGT_ARCH=%VSCMD_ARG_TGT_ARCH%
          cl /std:c++20 /EHsc /O2 /bigobj /I"include" /Fe:cforge.exe cforgev.cpp ws2_32.lib

      - name: Tests Windows
        shell: pwsh
        run: |
          $env:CFORGE_STDLIB = "$PWD\stdlib"
          .\cforge.exe --version
          .\cforge.exe tests\install-smoke\hello.cfv
          Get-ChildItem tests\cfv\*.cfv | ForEach-Object {
            & .\cforge.exe test $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "FAIL: $($_.Name)"; exit 1 }
          }
          Write-Host "OK — todos los tests pasan en Windows"

      - name: Empaquetar .zip
        shell: pwsh
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force -Path "pkg\cforge-$v-windows-x64" | Out-Null
          Copy-Item cforge.exe "pkg\cforge-$v-windows-x64\"
          Copy-Item -Recurse stdlib "pkg\cforge-$v-windows-x64\"
          Copy-Item README.md "pkg\cforge-$v-windows-x64\"
          Compress-Archive -Path "pkg\cforge-$v-windows-x64" -DestinationPath "pkg\cforge-$v-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: pkg/cforge-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Build extensión VS Code (.vsix)
# ─────────────────────────────────────────────────────────────────────────────
  build-vsix:
    name: Build VS Code Extension
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build .vsix
        working-directory: herramientas/vscode-cforgev
        run: |
          npm ci
          ./node_modules/.bin/vsce package --out "c-forge-${VERSION}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: herramientas/vscode-cforgev/c-forge-${{ env.VERSION }}.vsix
          if-no-files-found: error

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — Publicar GitHub Release con todos los artefactos
# ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publicar Release
    needs: [validate-version, build-linux, build-macos, build-windows, build-vsix]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Listar artefactos
        run: find release-assets -type f | sort

      - name: Generar SHA-256
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generar release-manifest.json
        run: |
          VERSION="${{ env.VERSION }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BASE="https://github.com/VemorisGroup/C-Forge/releases/download/v${VERSION}"
          get_sha() { grep "$1" release-assets/SHA256SUMS 2>/dev/null | awk '{print $1}' | head -1; }

          LINUX_TGZ="cforge-${VERSION}-linux-x64.tar.gz"
          LINUX_DEB="cforge_${VERSION}_amd64.deb"
          MACOS_TGZ="cforge-${VERSION}-macos-arm64.tar.gz"
          WIN_ZIP="cforge-${VERSION}-windows-x64.zip"
          VSIX="c-forge-${VERSION}.vsix"

          cat > release-assets/release-manifest.json <<EOF
          {
            "schema": 1,
            "version": "${VERSION}",
            "channel": "stable",
            "released_at": "${DATE}",
            "minimum_supported_version": null,
            "install_script": "https://raw.githubusercontent.com/VemorisGroup/C-Forge/main/install.sh",
            "changelog": "https://github.com/VemorisGroup/C-Forge/blob/main/CHANGELOG.md",
            "downloads": {
              "macos": {
                "arm64": {
                  "archive": {
                    "type": "tar.gz",
                    "filename": "${MACOS_TGZ}",
                    "url": "${BASE}/${MACOS_TGZ}",
                    "sha256": "$(get_sha $MACOS_TGZ)"
                  }
                }
              },
              "linux": {
                "x64": {
                  "archive": {
                    "type": "tar.gz",
                    "filename": "${LINUX_TGZ}",
                    "url": "${BASE}/${LINUX_TGZ}",
                    "sha256": "$(get_sha $LINUX_TGZ)"
                  },
                  "package": {
                    "type": "deb",
                    "filename": "${LINUX_DEB}",
                    "url": "${BASE}/${LINUX_DEB}",
                    "sha256": "$(get_sha $LINUX_DEB)"
                  }
                }
              },
              "windows": {
                "x64": {
                  "portable": {
                    "type": "zip",
                    "filename": "${WIN_ZIP}",
                    "url": "${BASE}/${WIN_ZIP}",
                    "sha256": "$(get_sha $WIN_ZIP)"
                  }
                }
              }
            },
            "editor": {
              "vscode": {
                "vsix": {
                  "filename": "${VSIX}",
                  "url": "${BASE}/${VSIX}",
                  "sha256": "$(get_sha $VSIX)"
                },
                "marketplace": null
              }
            },
            "sha256sums": "${BASE}/SHA256SUMS"
          }
          EOF

      - name: Generar latest.json
        run: |
          VERSION="${{ env.VERSION }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > release-assets/latest.json <<EOF
          {
            "version": "${VERSION}",
            "released_at": "${DATE}",
            "manifest": "https://github.com/VemorisGroup/C-Forge/releases/download/v${VERSION}/release-manifest.json"
          }
          EOF

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ env.VERSION }}"
          gh release create "v${VERSION}" \
            release-assets/cforge-${VERSION}-linux-x64.tar.gz \
            release-assets/cforge_${VERSION}_amd64.deb \
            release-assets/cforge-${VERSION}-macos-arm64.tar.gz \
            release-assets/cforge-${VERSION}-windows-x64.zip \
            "release-assets/c-forge-${VERSION}.vsix" \
            release-assets/SHA256SUMS \
            release-assets/release-manifest.json \
            release-assets/latest.json \
            --title "C-Forge v${VERSION}" \
            --generate-notes \
            --latest
