name: CI — C-Forge

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Compilar e interpretar en Linux y macOS ─────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            openssl_pkg: libssl-dev
          - os: macos-latest
            cxx: clang++
            openssl_pkg: openssl
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.openssl_pkg }} libsqlite3-dev

      - name: Instalar dependencias (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ${{ matrix.openssl_pkg }} sqlite

      - name: Compilar cforge
        run: make clean && make build CXX=${{ matrix.cxx }}

      - name: Verificar CLI autónomo
        run: |
          ./cforge --version
          ./cforge --help

      - name: Gate nativo completo
        run: |
          make release-check CXX=${{ matrix.cxx }}

      - name: Smoke test oficial
        run: |
          CFORGE_STDLIB=./stdlib bash tests/install-smoke/run_smoke.sh ./cforge

      - name: Test importar stdlib
        run: |
          printf 'importar "matematica"\nmostrar(piso(3.7))\n' > /tmp/test_imp.cfv
          CFORGE_STDLIB=./stdlib ./cforge /tmp/test_imp.cfv

      - name: Ejecutar ejemplos
        run: |
          for f in \
            ejemplos/01_hola.cfv \
            ejemplos/02_tipos.cfv \
            ejemplos/03_funciones.cfv \
            ejemplos/04_clases.cfv \
            ejemplos/05_manejo_errores.cfv \
            ejemplos/06_stdlib_texto.cfv \
            ejemplos/07_stdlib_lista.cfv \
            ejemplos/08_concurrencia.cfv \
            ejemplos/09_stdlib_algoritmos.cfv \
            ejemplos/10_stdlib_numero.cfv; do
            echo "  → $f"
            CFORGE_STDLIB=./stdlib ./cforge "$f"
          done
          echo "Todos los ejemplos OK"

      - name: Test stdlib algoritmos
        run: |
          printf 'importar "algoritmos"\nsea cmp = funcion(a, b) { retornar a - b }\nmostrar(mergesort([3,1,2], cmp))\n' > /tmp/test_algo.cfv
          CFORGE_STDLIB=./stdlib ./cforge /tmp/test_algo.cfv

      - name: Test stdlib numero
        run: |
          printf 'importar "numero"\nmostrar(numero_decimales(3.14159, 2))\nmostrar(seno(0))\n' > /tmp/test_num.cfv
          CFORGE_STDLIB=./stdlib ./cforge /tmp/test_num.cfv

  # ── Pruebas escritas en C-Forge, ejecutadas por el motor nativo ─────────────
  cforge-language-tests:
    name: C-Forge language tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar motor
        run: make clean && make build CXX=g++

      - name: Verificar y ejecutar pruebas .cfv
        run: |
          make check
          make test

  # Compila y ejecuta el núcleo en Windows. Los backends directos se validan
  # por formato en los otros jobs hasta disponer de runners de cada arquitectura.
  windows-native:
    name: Build & Test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar motor con MSVC
        shell: cmd
        run: cl /std:c++20 /EHsc /O2 /I"include" /Fe:cforge.exe cforgev.cpp ws2_32.lib

      - name: Ejecutar gate estable en Windows
        shell: pwsh
        run: |
          $env:CFORGE_STDLIB = "$PWD\stdlib"
          .\cforge.exe --version
          Get-ChildItem stdlib\*.cfv | ForEach-Object { & .\cforge.exe check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tests\cfv\*.cfv | ForEach-Object { & .\cforge.exe check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tests\cfv\*.cfv | ForEach-Object { & .\cforge.exe test $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

  # ── Docker build ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cforge:ci .

      - name: Test Docker image
        run: |
          echo 'mostrar("Docker OK")' > /tmp/docker_test.cfv
          docker run --rm -v /tmp:/work \
            --entrypoint cforge cforge:ci \
            /work/docker_test.cfv
