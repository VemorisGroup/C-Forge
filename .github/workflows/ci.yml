name: CI multiplataforma

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generar-pe-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir Stage 0 y backend PE
        shell: bash
        run: |
          clang++ -std=c++17 -O2 bootstrap/stage0/cforge_bootstrap.cpp \
            -o cforge-stage0
          ./cforge-stage0 bootstrap/direct/cforge_pe_x64.cfv \
            -o cforge-pe-x64
      - name: Emitir PE sin toolchain externo
        shell: bash
        run: |
          mkdir sin-toolchain
          for tool in clang++ clang g++ gcc cc cl link lld ld as python python3
          do
            printf '#!/bin/sh\nexit 97\n' > "sin-toolchain/$tool"
            chmod +x "sin-toolchain/$tool"
          done
          PATH="$PWD/sin-toolchain" "$PWD/cforge-pe-x64" \
            "$PWD/bootstrap/fixtures/machine_hello_windows_b6.cfv" \
            -o "$PWD/cforge-pe-smoke.exe"
          file cforge-pe-smoke.exe | grep 'PE32+ executable'
      - uses: actions/upload-artifact@v4
        with:
          name: cforge-pe-x64-smoke
          path: cforge-pe-smoke.exe
          if-no-files-found: error

  ejecutar-pe-x64:
    needs: generar-pe-x64
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cforge-pe-x64-smoke
      - name: Ejecutar PE generado por C-Forge
        shell: pwsh
        run: |
          $salida = & .\cforge-pe-smoke.exe
          if ($LASTEXITCODE -ne 0) {
            throw "El PE terminó con código $LASTEXITCODE"
          }
          if ($salida -ne "Hola maquina Windows desde C-Forge") {
            throw "Salida PE inesperada: $salida"
          }

  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar C-Forge y dependencias verificadas
        run: python -m pip install -e .
      - name: Verificar promesas públicas y evidencias
        run: python herramientas/verificar_capacidades.py
      - name: Prueba portable
        shell: bash
        run: |
          python cforgev.py --version
          python cforgev.py ejemplos/hola.cfv
          python cforgev.py check ejemplos/hola.cfv
          python cforgev.py check ejemplos/tipos_genericos_16.cfv
          python cforgev.py ejemplos/tipos_genericos_16.cfv
          python cforgev.py vm ejemplos/hola.cfv
          python cforgev.py vm ejemplos/async_await_16.cfv
          python cforgev.py parity ejemplos/paridad_16.cfv --json
          python cforgev.py bytecode ejemplos/async_await_16.cfv -o async_await_16.cfb
          python cforgev.py vm async_await_16.cfb
          python cforgev.py --llvm ejemplos/llvm_nucleo_15.cfv -o llvm_nucleo_15.ll
          python cforgev.py --llvm ejemplos/llvm_textos_16.cfv -o llvm_textos_16.ll
          python cforgev.py --llvm ejemplos/llvm_listas_16.cfv -o llvm_listas_16.ll
          python cforgev.py --llvm ejemplos/llvm_objetos_16.cfv -o llvm_objetos_16.ll
          python cforgev.py --llvm ejemplos/llvm_genericos_16.cfv -o llvm_genericos_16.ll
          python cforgev.py --llvm ejemplos/llvm_mapas_16.cfv -o llvm_mapas_16.ll
          python cforgev.py --llvm ejemplos/colecciones_16.cfv -o llvm_colecciones_16.ll
          python cforgev.py --llvm ejemplos/destructores_llvm_16.cfv -o llvm_destructores_16.ll
          python cforgev.py --llvm ejemplos/excepciones_llvm_16.cfv -o llvm_excepciones_16.ll
          python cforgev.py --llvm ejemplos/interop/ffi_llvm_16.cfv -o llvm_ffi_16.ll
          python cforgev.py --llvm ejemplos/opciones_llvm_16.cfv -o llvm_opciones_16.ll
      - name: Verificar LLVM nativo en Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang llvm_nucleo_15.ll -o llvm-nucleo
          clang llvm_textos_16.ll -o llvm-textos
          clang llvm_listas_16.ll -o llvm-listas
          clang llvm_objetos_16.ll -o llvm-objetos
          clang llvm_genericos_16.ll -o llvm-genericos
          clang llvm_mapas_16.ll -o llvm-mapas
          clang llvm_colecciones_16.ll -o llvm-colecciones
          clang llvm_destructores_16.ll -o llvm-destructores
          clang llvm_excepciones_16.ll -o llvm-excepciones
          clang llvm_ffi_16.ll ejemplos/interop/ffi_llvm_16.c -o llvm-ffi
          clang llvm_opciones_16.ll -o llvm-opciones
          ./llvm-nucleo
          ./llvm-textos
          ./llvm-listas
          ./llvm-objetos
          ./llvm-genericos
          ./llvm-mapas
          ./llvm-colecciones
          ./llvm-destructores
          ./llvm-excepciones
          ./llvm-ffi
          ./llvm-opciones
      - name: Herramientas profesionales
        run: python -m unittest tests.test_professional_tooling -v
      - name: Suite completa
        run: python -m unittest discover -s tests -v
      - name: Fuzzing determinista
        run: python tests/fuzz_smoke.py --cases 10000
