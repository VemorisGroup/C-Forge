name: CI — C-Forge v3.0.0

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Compilar e interpretar en Linux y macOS ─────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            openssl_pkg: libssl-dev
          - os: macos-latest
            cxx: clang++
            openssl_pkg: openssl
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.openssl_pkg }} libsqlite3-dev

      - name: Instalar dependencias (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ${{ matrix.openssl_pkg }} sqlite

      - name: Compilar cforgev
        run: make build CXX=${{ matrix.cxx }}

      - name: Smoke test básico
        run: |
          echo 'mostrar("C-Forge CI OK")' > /tmp/ci_test.cfv
          CFORGE_STDLIB=./stdlib ./cforgev /tmp/ci_test.cfv

      - name: Test importar stdlib
        run: |
          printf 'importar "matematica"\nmostrar(piso(3.7))\n' > /tmp/test_imp.cfv
          CFORGE_STDLIB=./stdlib ./cforgev /tmp/test_imp.cfv

      - name: Ejecutar ejemplos
        run: |
          for f in \
            ejemplos/01_hola.cfv \
            ejemplos/02_tipos.cfv \
            ejemplos/03_funciones.cfv \
            ejemplos/04_clases.cfv \
            ejemplos/05_manejo_errores.cfv \
            ejemplos/06_stdlib_texto.cfv \
            ejemplos/07_stdlib_lista.cfv \
            ejemplos/08_concurrencia.cfv \
            ejemplos/09_stdlib_algoritmos.cfv \
            ejemplos/10_stdlib_numero.cfv; do
            echo "  → $f"
            CFORGE_STDLIB=./stdlib timeout 15 ./cforgev "$f"
          done
          echo "Todos los ejemplos OK"

      - name: Test stdlib algoritmos
        run: |
          printf 'importar "algoritmos"\nsea cmp = funcion(a, b) { retornar a - b }\nmostrar(mergesort([3,1,2], cmp))\n' > /tmp/test_algo.cfv
          CFORGE_STDLIB=./stdlib ./cforgev /tmp/test_algo.cfv

      - name: Test stdlib numero
        run: |
          printf 'importar "numero"\nmostrar(numero_decimales(3.14159, 2))\nmostrar(seno(0))\n' > /tmp/test_num.cfv
          CFORGE_STDLIB=./stdlib ./cforgev /tmp/test_num.cfv

  # ── Herramientas Python ─────────────────────────────────────────────────────
  python-tools:
    name: Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas desde pyproject.toml
        run: pip install -e . --quiet

      - name: Test cfmt
        run: |
          echo 'mostrar("hola")' > /tmp/test.cfv
          python3 tools/cfmt.py /tmp/test.cfv --check 2>/dev/null || true
          echo "cfmt OK"

      - name: Test cflint
        run: |
          python3 tools/cflint.py /tmp/test.cfv 2>/dev/null || true
          echo "cflint OK"

      - name: Test cforge CLI
        run: python3 tools/cforge_cli.py --help || true

  # ── Docker build ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cforge:ci .

      - name: Test Docker image
        run: |
          echo 'mostrar("Docker OK")' > /tmp/docker_test.cfv
          docker run --rm -v /tmp:/work \
            --entrypoint cforgev cforge:ci \
            /work/docker_test.cfv
