[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cforge-tools"
version = "3.0.0"
description = "C-Forge Language Tools — Type checker, profiler, coverage, migrations, scaffolding"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "C-Forge Team"}]

[project.scripts]
cfmt      = "tools.cfmt:main"
cflint    = "tools.cflint:main"
cftest    = "tools.cftest:main"
cfdoc     = "tools.cfdoc:main"
cfwatch   = "tools.cfwatch:main"
cforgec   = "tools.cforgec:main"
cforge    = "tools.cforge_cli:main"
cftype    = "tools.cftype:main"
cfcover   = "tools.cfcover:main"
cfprofile = "tools.cfprofile:main"
cfmigrate = "tools.cfmigrate:main"
cfgen     = "tools.cfgen:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
